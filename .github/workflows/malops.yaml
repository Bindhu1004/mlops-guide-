name: MLOps Data Pipeline Automation

on:
  push:
    branches:
      - main

# Runs on pull requests
  pull_request:

permissions:
  id-token: write # Required for requesting the OIDC JWT from AWS
  contents: read  # Required to checkout the code
  pull-requests: write

jobs:
  train-and-report:
    permissions: write-all
    #run-pipeline:
    runs-on: ubuntu-latest
# This image has CML, DVC, Node, and canvas fully configured out of the box
    container: docker://ghcr.io/iterative/cml:0-dvc2-base1
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup CML
        uses: iterative/setup-cml@v2 # <-- Use stable v2 version
      - name: Setup CML
        uses: iterative/setup-cml@v2 # <-- Use stable v2 version

      # ... Your setup-python, pip install dvc[s3], and dvc pull steps ...

      - name: Run Pipeline and Generate Metrics
        run: |
          dvc repro

          # Start creating the markdown report
          echo "## Model Performance Report" > report.md
          cat evaluation/metrics.json >> report.md

          # Add a visualization plot image to the markdown file
          echo "### Training History" >> report.md
          echo "![](./evaluation/plots/training_history.png)" >> report.md

      - name: Publish CML Report to PR
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }} # <-- Pass the built-in token
        run: |
          cml comment create report.md

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "dvc[s3]"

      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1 # Change to your chosen AWS region

      - name: Pull Data from S3 via DVC
        run: |
          dvc repro --pull
      - name: Setup CML
        if: github.event_name == 'pull_request'
        uses: iterative/setup-cml@v2
        with:
          version: '0.20.6'
      - name: Create CML report
        if: github.event_name == 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch all other Git branches
          git fetch --depth=1 origin main:main

          # Add title to the report
          echo "# Experiment Report (${{ github.sha }})" >> report.md

          # Compare parameters to main branch
          echo "## Params workflow vs. main" >> report.md
          dvc params diff main --md >> report.md

          # Compare metrics to main branch
          echo "## Metrics workflow vs. main" >> report.md
          dvc metrics diff main --md >> report.md

          # Compare plots (images) to main branch
          dvc plots diff main

          # Create plots
          echo "## Plots" >> report.md

          # Create training history plot
          echo "### Training History" >> report.md
          echo "#### main" >> report.md
          echo '![](./dvc_plots/static/main_evaluation_plots_training_history.png "Training History")' >> report.md
          echo "#### workspace" >> report.md
          echo '![](./dvc_plots/static/workspace_evaluation_plots_training_history.png "Training History")' >> report.md

          # Create predictions preview
          echo "### Predictions Preview" >> report.md
          echo "#### main" >> report.md
          echo '![](./dvc_plots/static/main_evaluation_plots_pred_preview.png "Predictions Preview")' >> report.md
          echo "#### workspace" >> report.md
          echo '![](./dvc_plots/static/workspace_evaluation_plots_pred_preview.png "Predictions Preview")' >> report.md

          # Create confusion matrix
          echo "### Confusion Matrix" >> report.md
          echo "#### main" >> report.md
          echo '![](./dvc_plots/static/main_evaluation_plots_confusion_matrix.png "Confusion Matrix")' >> report.md
          echo "#### workspace" >> report.md
          echo '![](./dvc_plots/static/workspace_evaluation_plots_confusion_matrix.png "Confusion Matrix")' >> report.md

          # Publish the CML report
          cml comment update --target=pr --publish report.md
