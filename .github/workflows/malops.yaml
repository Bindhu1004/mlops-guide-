name: MLOps Data Pipeline Automation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write      # Required for secure AWS OIDC auth
  contents: read       # Required to read repository code
  pull-requests: write # Required so CML can comment on your PR

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    # NOTICE: The 'container:' line has been removed to break down environment isolation barriers!
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Setup Node.js (Required for CML)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install CML CLI Tool
        uses: iterative/setup-cml@v2

      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-1 # Ensure this matches your S3 bucket region
          audience: sts.amazonaws.com

      - name: Install Python Dependencies and DVC
        run: |
          python -m pip install --upgrade pip
          pip install "pathspec==0.11.2"
          pip install --upgrade "dvc[s3]"
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Pull Data and Run Pipeline
        run: |
          # Since everything runs on the host, DVC perfectly inherits the AWS credentials!
          dvc pull
          dvc repro

      - name: Generate and Publish CML Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Fetch main branch metadata so DVC can calculate differences
          git fetch origin main:main

          # 2. Start the markdown report header with the current commit hash
          echo "## Experiment Report ($(git rev-parse --short HEAD))" > report.md
          echo "" >> report.md

          # 3. Generate Hyperparameter Comparison Table
          echo "### Params workflow vs. main" >> report.md
          dvc params diff main --targets params.yaml --md >> report.md
          echo "" >> report.md

          # 4. Generate Performance Metrics Comparison Table
          echo "### Metrics workflow vs. main" >> report.md
          dvc metrics diff main --targets evaluation/metrics.json --md >> report.md
          echo "" >> report.md

          # 5. Append Visual Plots
          echo "### Plots" >> report.md
          echo "#### Training History" >> report.md
          
          # Append your training history curves
          if [ -f evaluation/plots/training_history.png ]; then
            echo "![](./evaluation/plots/training_history.png)" >> report.md
          fi
          
          # 6. Append Predictions Preview (Images grid)
          echo "### Predictions Preview" >> report.md
          if [ -f evaluation/plots/predictions_preview.png ]; then
            echo "![](./evaluation/plots/predictions_preview.png)" >> report.md
          fi

          # 7. Post the unified rich markdown report to the Pull Request
          cml comment create report.md
