name: MLOps Data Pipeline Automation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write      # Required for secure AWS OIDC auth
  contents: read       # Required to read repository code
  pull-requests: write # Required so CML can comment on your PR

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    # NOTICE: The 'container:' line has been removed to break down environment isolation barriers!
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Setup Node.js (Required for CML)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install CML CLI Tool
        uses: iterative/setup-cml@v2

      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-1 # Ensure this matches your S3 bucket region
          audience: sts.amazonaws.com

      - name: Install Python Dependencies and DVC
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade "dvc[s3]" scmrepo pathspec
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Pull Data and Run Pipeline
        run: |
          # Since everything runs on the host, DVC perfectly inherits the AWS credentials!
          dvc pull
          dvc repro

      - name: Generate and Publish CML Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## 🚀 Experiment Performance Metrics" > report.md
          
          echo "### Core Model Metrics" >> report.md
          echo "\`\`\`json" >> report.md
          cat evaluation/metrics.json >> report.md
          echo "\`\`\`" >> report.md
          
          echo "### 📊 Visual Evaluation" >> report.md
          if [ -f evaluation/plots/training_history.png ]; then
            echo "#### Training History" >> report.md
            echo "![](./evaluation/plots/training_history.png)" >> report.md
          fi
          
          if [ -f evaluation/plots/confusion_matrix.png ]; then
            echo "#### Confusion Matrix" >> report.md
            echo "![](./evaluation/plots/confusion_matrix.png)" >> report.md
          fi
          
          cml comment create report.md
    
